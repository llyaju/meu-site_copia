<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Completo</title>
</head>
<body>
    <form action="/enviar" method="POST">
        <fieldset>
            <legend>Informações Pessoais</legend>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="0" max="120">
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento">
            <label for="site">Site pessoal:</label>
            <input type="url" id="site" name="site">
            <label for="arquivo">Anexar arquivo:</label>
            <input type="file" id="arquivo" name="arquivo">
            <label for="cor">Cor favorita:</label>
            <input type="color" id="cor" name="cor">
        </fieldset>
        <fieldset>
            <legeng>Preferências</legeng>
            <label for="genero">Gênero:</label>
            <select id="genero" name="genero">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>
            <label for="interesses">Interesses:</label>
            <input type="checkbox" id="esporte" name="interesses" value="esporte">
            <label for="esporte">Esportes</label>
            <input type="checkbox" id="musica" name="interesses" value="musica">
            <label for="musica">Música</label>
            <label>Escolha seu plano:</label>
            <input type="radio" id="basico" name="plano" value="basico" checked>
            <label for="basico">Básico</label>
            <input type="radio" id="premium" name="plano" value="premium">
            <label for="premium">Premium</label>
        </fieldset>
        <fieldset>
            <legend>Contato</legend>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(xx) xxxx-xxxx">
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="4" cols="50"></textarea>
        </fieldset>
        <fieldset>
            <legend>Controles e Envio</legend>
            <label for="pesquisa">Pesquisa rápida:</label>
            <input type="search" id="pesquisa" name="pesquisa">
            <label for="hora">Horário preferido para contato:</label>
            <input type="time" id="hora" name="hora">
            <label for="semana">Semana disponível:</label>
            <input type="week" id="semana" name="semana">
            <label for="range">Nível de satisfação:</label>
            <input type="range" id="range" name="range" min="0" max="10">
            <input type="hidden" name="token" value="1234567890">
        </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
