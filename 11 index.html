<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model</title>
    <style>
        /* Usando classe */
        .caixa {
            width: 300px;
            padding: 20px;
            border: 5px solid #000;
            margin: 15px;
        }

        /* Usando ID */
        #caixaUnica {
            width: 400px;
            padding: 30px;
            border: 3px solid #333;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="caixa">
        Este é um exemplo de modelo de caixa com classe.
    </div>
    <div id="caixaUnica">
        Este é um exemplo de modelo de caixa com ID.
    </div>
</body>
</html>
