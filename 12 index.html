<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Listas e Links</title>
    <style>
        /* Usando tag */
        ul {
            list-style-type: square;
            margin-left: 20px;
        }
        /* Usando classe */
        .link-stilo {
            color: blue;
            text-decoration: none;
        }
        /* Usando classe com hover */
        .link-estilo:hover {
            color: red;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Listas e Links</h1>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <a href="https://www.example.com" class="link-estilo">Clique aqui para acessar o exemplo</a>
</body>
</html>
