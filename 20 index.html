<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelector() Exemplo</title>
    <style>
        .destaque {
            background-color: lightgray;
            padding: 20px;
        }
    </style>
</head>
<body>
    
    <div class="destaque">Texto destacado</div>
    <button onclick="mudarCor()">Mudar Cor</button>

    <script>
        function mudarCor() {
            const elemento = document.querySelector('.destaque'); // Seleciona o elemento pela classe
            elemento.style.backgroundColor = 'yellow'; // Altera a cor de fundo
        }
    </script>
</body>
</html>
