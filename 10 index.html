<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Propriedades</title>
    <style>
        /* Usando tag */
        body {
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* Usando ID */
        #titulo {
            color: blue;
            font-size: 36px;
            margin-bottom: 20px;
        }

        /* Usando classe */
        .texto {
            font-size: 18px;
            line-height: 1.6;
            margin-top: 10px;
            padding: 10px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Exemplo de Cores, Fontes e Espaçamentos</h1>
    <p class="texto">Este parágrafo tem uma fonte e cor personalizadas, e o texto tem um bom espaçamento.</p>
</body>
</html>
