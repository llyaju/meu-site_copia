<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Fortmulário</title>
</head>
<body>
    <form id="formulario">
        <label for="name">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome"><br><br>
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail"><br>
        <input type="submit" value="Enviar">
        <p id="mensagem-erro" style="color: red;"></p>
    </form>
    <script>
        const form = document.getElementById('formulario');
        const emailInput = document.getElementById('email');
        const mensagemErro = document.getElementById('mensagem-erro');
        form.addEventListener('submit', function(event) {
            mensagemErro.textContent = ''; // Limpa a mensagem anterior
                if (nomeInput.value.trim() === '') {
                    mensagemErro.textContent = 'Por favor, preencha seu nome.';
                    event.preventDefault(); // Impede o envio do formulário
            } else if (!emailInput.value.includes('@')) {
                mensagemErro.textContent = 'Por favor, insira um e-mail válido.';
                event.preventDefault(); // Impede o envio
            }
        })
    </script>
</body>
</html>
